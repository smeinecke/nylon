name: Build package

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-debs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os-version: ["stretch", "buster", "bullseye", "bookworm", "trixie"]
    steps:
      - uses: actions/checkout@v6
      - uses: jtdor/build-deb-action@v1
        env:
          DEB_BUILD_OPTIONS: noautodbgsym
        with:
          docker-image: "debian:${{ matrix.os-version }}-slim"
          buildpackage-opts: --build=binary --no-sign
          # EOL dists need rewritten apt sources: stretch and buster only
          # exist on archive.debian.org; bullseye-security was removed from
          # deb.debian.org but is not archived yet, so pin bullseye to the
          # snapshot its Docker image was built from (matches the image's
          # installed package versions).
          setup-hook: |
            case "${{ matrix.os-version }}" in
              stretch)
                printf '%s\n' \
                  'deb http://archive.debian.org/debian stretch main' \
                  'deb http://archive.debian.org/debian-security stretch/updates main' \
                  > /etc/apt/sources.list
                ;;
              buster)
                printf '%s\n' \
                  'deb http://archive.debian.org/debian buster main' \
                  'deb http://archive.debian.org/debian buster-updates main' \
                  'deb http://archive.debian.org/debian-security buster/updates main' \
                  > /etc/apt/sources.list
                ;;
              bullseye)
                printf '%s\n' \
                  'deb http://snapshot.debian.org/archive/debian/20260824T000000Z bullseye main' \
                  'deb http://snapshot.debian.org/archive/debian-security/20260824T000000Z bullseye-security main' \
                  'deb http://snapshot.debian.org/archive/debian/20260824T000000Z bullseye-updates main' \
                  > /etc/apt/sources.list
                ;;
            esac
            echo 'Acquire::Check-Valid-Until "false";' \
              > /etc/apt/apt.conf.d/99eol-dists
      - name: Upload deb files
        uses: actions/upload-artifact@v6
        with:
          name: "packages-${{ matrix.os-version }}"
          path: ./debian/artifacts/*

  # jessie's apt (1.0.x) cannot do 'apt-get build-dep ./dir', which the
  # build-deb-action relies on, so build it with a plain docker run.
  build-deb-jessie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build package (jessie)
        run: |
          mkdir -p debian/artifacts
          docker run --rm -v "$PWD:/src" -w /src debian:jessie-slim bash -c '
            set -e
            printf "%s\n" \
              "deb [trusted=yes] http://archive.debian.org/debian jessie main" \
              "deb [trusted=yes] http://archive.debian.org/debian jessie-backports main" \
              "deb [trusted=yes] http://archive.debian.org/debian-security jessie/updates main" \
              > /etc/apt/sources.list
            echo "Acquire::Check-Valid-Until \"false\";" \
              > /etc/apt/apt.conf.d/99eol-dists
            apt-get update
            # debhelper >= 10 (for compat level 10) is only in backports
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              -t jessie-backports debhelper dpkg-dev build-essential libevent-dev
            mkdir -p /tmp/build && cp -a /src/. /tmp/build/src
            cd /tmp/build/src
            DEB_BUILD_OPTIONS=noautodbgsym \
              dpkg-buildpackage -us -uc -b
            mkdir -p /src/debian/artifacts
            cp ../nylon_*.deb /src/debian/artifacts/
            '
      - name: Upload deb files
        uses: actions/upload-artifact@v6
        with:
          name: "packages-jessie"
          path: ./debian/artifacts/*
