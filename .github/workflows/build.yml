name: Build package

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare release matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      os_matrix: ${{ steps.releases.outputs.os_matrix }}
      repo_versions: ${{ steps.releases.outputs.repo_versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Load Supported Releases
        id: releases
        run: |
          set -eu
          mapfile -t releases < <(grep -E '^[a-z]+(/[a-z]+)?:[a-z0-9]+$' .github/supported-releases.txt)
          if [ "${#releases[@]}" -eq 0 ]; then
            echo "No supported releases found in .github/supported-releases.txt"
            exit 1
          fi

          os_matrix="$(printf '%s\n' "${releases[@]}" | jq -R . | jq -s -c .)"
          repo_versions="$(printf '%s\n' "${releases[@]}" | cut -d: -f2)"

          echo "os_matrix=${os_matrix}" >> "$GITHUB_OUTPUT"
          {
            echo "repo_versions<<EOF"
            printf '%s\n' "${repo_versions}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os-version: ${{ fromJson(needs.prepare.outputs.os_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Extract release codename
        run: |
          os_version="${{ matrix.os-version }}"
          echo "debian_release=${os_version##*:}" >> "$GITHUB_ENV"
      - name: Prepare and build inside target container
        # The build runs via docker CLI rather than a job container or
        # node-based action: node20 actions require glibc >= 2.28 which
        # the EOL images lack, and jessie's apt cannot do the directory
        # form of 'apt-get build-dep'.
        run: |
          set -eu
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${{ matrix.os-version }}" \
            bash -c './scripts/ci/setup-build-env.sh && ./scripts/build.sh && ./scripts/test/smoke.sh'
      - name: Upload deb files
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ env.debian_release }}
          path: ./nylon_*.deb
          if-no-files-found: error

  merge-artefacts:
    name: Merge all deb files to single artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - name: debian-packages
        uses: actions/upload-artifact/merge@v7
        with:
          name: merged-artifacts
          pattern: packages-*

  add_release:
    name: Add package to release
    needs: merge-artefacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: merged-artifacts
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./*.deb

  add_repo:
    name: Add packages to public debian repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - merge-artefacts
      - prepare
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: "merged-artifacts"
      - name: Check signing key
        id: key
        run: |
          if [ -n "${APT_SIGNING_KEY:-}" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::APT_SIGNING_KEY not configured; skipping apt repo publish"; fi
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
      - name: Add releases to repo
        if: steps.key.outputs.present == 'true'
        uses: smeinecke/apt-repo-action@v2.2.1
        with:
          github_token: ${{ github.token }}
          repo_supported_arch: |
            amd64
          repo_supported_version: ${{ needs.prepare.outputs.repo_versions }}
          file: |
            *.deb
          version_by_filename: true
          private_key: ${{ secrets.APT_SIGNING_KEY }}
          key_passphrase: ""
          skip_duplicates: true
